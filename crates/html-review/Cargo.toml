[package]
name = "pdfcraft-html-review"
description = "Source-preserving HTML review and native paged document containers"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = []
native = ["dep:ammonia", "dep:base64", "dep:tempfile", "dep:regex", "dep:url"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sha2 = "0.10"
scraper = { version = "0.24", features = ["deterministic"] }
lol_html = "2.7"
ammonia = { version = "4.1", optional = true }
base64 = { version = "0.22", optional = true }
tempfile = { version = "3", optional = true }
regex = { version = "1", optional = true }
url = { version = "2", optional = true }
